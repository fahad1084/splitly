# Checks every push: flutter analyze + all Dart tests.
# No secrets: the tests use fakes (no Supabase, no Firebase). `.env` is a
# git-ignored app asset, so the placeholder file `.env.example` stands in.
# (The SQL tests need a database and are run by hand — see supabase/README.md.)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3   # same as the developer laptop
          channel: stable
          cache: true

      - name: Placeholder .env (app asset, no secrets)
        run: cp .env.example .env

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Dart tests
        run: flutter test
